<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acaedu - Professional Academic Platform for Students, Lecturers, and Administrators" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo.svg" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#1865f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Acaedu" />
    <meta name="application-name" content="Acaedu Educational App" />
    <meta name="msapplication-TileColor" content="#1865f2" />
    <meta name="msapplication-TileImage" content="/logo.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Acaedu — Professional Academic Platform" />
    <meta property="og:description" content="AI-powered scheduling, real-time notifications, and seamless collaboration for students, lecturers, and administrators." />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:site_name" content="Acaedu" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Acaedu — Professional Academic Platform" />
    <meta name="twitter:description" content="AI-powered scheduling, real-time notifications, and seamless collaboration for students, lecturers, and administrators." />
    <meta name="twitter:image" content="/logo.svg" />

    <!-- Fonts — Lato (Khan Academy) + Source Sans 3 (backcompat) + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&family=Source+Sans+3:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <title>Acaedu — Professional Academic Platform</title>
  </head>
  <body>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('acaedu-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
          else if (t === 'midnight') document.documentElement.setAttribute('data-theme', 'midnight');
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
