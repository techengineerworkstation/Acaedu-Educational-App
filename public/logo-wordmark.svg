<svg xmlns="http://www.w3.org/2000/svg" width="180" height="48" viewBox="0 0 180 48">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c1272d"/>
      <stop offset="100%" stop-color="#e8535a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#025e6b"/>
      <stop offset="100%" stop-color="#4dd0d8"/>
    </linearGradient>
  </defs>
  <!-- Icon mark -->
  <g transform="translate(24,24)">
    <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#00262b"/>
    <path d="M-13,16 L-1,-16" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M1,-16 L13,16" stroke="url(#teal)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M-8,5 L8,5" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="-20" r="1.8" fill="url(#accent)" opacity="0.9"/>
  </g>
  <!-- Wordmark -->
  <text x="60" y="30" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="white" letter-spacing="-0.5">Acaedu</text>
  <!-- Subtle tagline line -->
  <line x1="60" y1="36" x2="118" y2="36" stroke="url(#teal)" stroke-width="0.8" opacity="0.4"/>
</svg>
